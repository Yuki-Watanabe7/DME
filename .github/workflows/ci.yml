name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      
permissions:
  actions: write
  contents: read

jobs:
  ci:
    name: Pkg.test()
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12.6'

      - uses: julia-actions/cache@v3

      - name: Install dependencies
        run: julia --project=. -e "using Pkg; Pkg.instantiate()"

      - name: Test (with quality export + Coverage.jl)
        run: julia --project=. scripts/quality_export_coverage.jl

      - name: Upload quality export (short-term; Issue #209)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-export
          path: artifacts/quality/quality-export.json
          retention-days: 14
          if-no-files-found: warn