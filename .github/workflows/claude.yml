name: Claude Code

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: julia-actions/setup-julia@v2
        if: ${{ !contains(toJson(github.event.issue.labels), 'docs-only') }}
        with:
          version: '1.12.6'

      - name: Install dependencies
        if: ${{ !contains(toJson(github.event.issue.labels), 'docs-only') }}
        run: julia --project=. -e "using Pkg; Pkg.instantiate()"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          additional_permissions: |
            actions: read

          show_full_output: true

          claude_args: |
            --append-system-prompt "このリポジトリでは、Issue対応時に以下を標準ルールとして必ず守ってください。

            1. 作業前に既存コードと関連テストを確認すること。
            2. 変更後の検証は変更種別に応じて行うこと:
               - Juliaコード、Project.toml、Manifest.toml、テスト、CI設定を変更した場合:
                 julia --project=. -e "using Pkg; Pkg.test()"
               - docs配下またはMarkdownのみの変更の場合:
                 Julia環境セットアップおよびPkg.test()は不要。
                 最終コメントまたはPR本文に「docs-onlyのためJulia testは未実行」と明記すること。
            3. Pkg.test() が失敗した場合は、失敗内容を確認し、可能な範囲で修正してから再実行すること。
            4. テスト実行後、最終コメントまたは PR 本文に以下を必ず明記すること:
               - 実行したテストコマンド
               - 成功/失敗の結果
               - 失敗した場合は失敗内容の要約
               - 環境都合で実行できなかった場合は、その理由
            5. 実装だけで終了せず、可能であれば必ずコミット・プッシュし、PR作成リンクまたはPRを提示すること。
            6. 設計・ドメインモデル・アーキテクチャに影響する変更を行う場合は、関連ドキュメント更新の要否を確認すること。
            7. Issue本文の受け入れ条件を満たしているか、最後に自己確認すること。"
            --allowedTools "Glob,Grep,LS,Read,Edit,Write,MultiEdit,Bash(git status),Bash(git status *),Bash(git diff),Bash(git diff *),Bash(git add *),Bash(git commit *),Bash(git rm *),Bash(/home/runner/work/_actions/anthropics/claude-code-action/v1/scripts/git-push.sh *),Bash(julia --version),Bash(julia --project=. *)"
