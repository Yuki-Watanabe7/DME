# DME 設定ファイルサンプル
# このファイルをコピーして config/dme.toml を作成し、値を編集してください。
# config/dme.toml はgit管理対象外です（.gitignore 参照）。
#
# cp config/dme.example.toml config/dme.toml
#
# 注意: API キー等の秘密情報は環境変数（.env）で管理することを推奨します。
#       このファイルには秘密情報を直接記載しないでください。

# ---------------------------------------------------------------------------
# データ取得モード設定
# ---------------------------------------------------------------------------
[data]
# mode の選択肢:
#   "live"    - 実際の外部 API を使用
#   "fixture" - ローカルの fixture データを使用（API キー不要・デフォルト）
#   "mock"    - インメモリのモックプロバイダーを使用（テスト向け）
mode = "fixture"

# fixture データのディレクトリパス（mode = "fixture" 時のみ使用）
fixture_dir = "test/fixtures"

# API タイムアウト（秒）
api_timeout = 30

# ---------------------------------------------------------------------------
# FRED（Federal Reserve Economic Data）設定
# ---------------------------------------------------------------------------
[fred]
# API キーは環境変数 FRED_API_KEY で設定することを推奨
# api_key = ""  # 直接記載不可・環境変数を使用すること
base_url = "https://api.stlouisfed.org/fred"

# デフォルト取得期間
default_start = "1990-01-01"
default_end = "2024-12-31"

# ---------------------------------------------------------------------------
# e-Stat（政府統計の総合窓口）設定
# ---------------------------------------------------------------------------
[estat]
# API キーは環境変数 ESTAT_APP_ID で設定することを推奨
# app_id = ""  # 直接記載不可・環境変数を使用すること
base_url = "https://api.e-stat.go.jp/rest/3.0"

# ---------------------------------------------------------------------------
# LLM（OpenAI）設定
# ---------------------------------------------------------------------------
[llm]
# API キーは環境変数 OPENAI_API_KEY で設定することを推奨
provider = "openai"
model = "gpt-4o-mini"
max_tokens = 2048
temperature = 0.0

# ---------------------------------------------------------------------------
# ログ設定
# ---------------------------------------------------------------------------
[logging]
# レベル: "debug" | "info" | "warn" | "error"
level = "info"
